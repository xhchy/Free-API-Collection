name: secret scan

# 每次 push / PR 都跑一遍仓库自带的脱敏自检。
# 本地跑 check-secrets.py 靠自觉，CI 是最后一道闸：
# 万一以后有人把 vault/keys.json 或真 key 提交上去，这里会直接红。

on:
  push:
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run repository secret scanner
        run: python tools/check-secrets.py
